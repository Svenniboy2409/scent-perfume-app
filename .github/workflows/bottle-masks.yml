name: Measure bottle masks

# Re-measures the Shelfie cut-out masks (public/bottle-masks, see
# scripts/bottle-masks/make_masks.py) and commits them. Runs when the script
# changes, or by hand — e.g. after adding perfumes.
on:
  push:
    paths:
      - scripts/bottle-masks/**
      - .github/workflows/bottle-masks.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bottle-masks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  masks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy scipy pillow

      - name: Measure masks
        run: python scripts/bottle-masks/make_masks.py

      - name: Commit masks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bottle-masks src/data/bottleMasks.js
          if git diff --cached --quiet; then
            echo "Masks unchanged."
          else
            git commit -m "Measure bottle cut-out masks"
            git push
          fi
