name: Measure bottle masks

# Re-measures the Shelfie cut-out masks (public/bottle-masks, see
# scripts/bottle-masks/make_masks.py) and commits them. Runs when the script
# or the perfume list changes, or by hand.
on:
  push:
    paths:
      - scripts/bottle-masks/**
      - .github/workflows/bottle-masks.yml
      - src/data/fragranticaIds.js
      - src/data/perfumes.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bottle-masks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  masks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy scipy pillow

      - name: Measure masks
        run: python scripts/bottle-masks/make_masks.py --preview previews --dump afnan-supremacy-not-only-intense,armani-code-parfum,burberry-hero,chanel-bleu-de-chanel-edt,dior-addict,dolce-gabbana-k,hermes-h24,jpg-la-belle-le-parfum,lattafa-asad,lv-nouveau-monde,mugler-amen,parfums-de-marly-haltane,rasasi-la-yuqawam-homme,valentino-uomo-2014,viktor-rolf-spicebomb,ysl-myslf-le-parfum,jpg-scandal,montale-intense-cafe,viktor-rolf-flowerbomb,ysl-libre

      # Temporary: previews of chosen cut-outs on a throwaway branch.
      - name: Push previews
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd previews && git init -q -b p && git add strip.png && git commit -qm previews
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" p:refs/heads/tmp-mask-previews

      - name: Commit masks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bottle-masks src/data/bottleMasks.js
          if git diff --cached --quiet; then
            echo "Masks unchanged."
          else
            git commit -m "Measure bottle cut-out masks"
            git push
          fi
